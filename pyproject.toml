[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vsum"
version = "0.4.0"
description = "视频/音频 → 可逐秒引用的逐字稿与带出处的摘要"
readme = "README.md"
license = {text = "MIT"}
keywords = ["transcription", "subtitle", "whisper", "ffmpeg", "summary", "srt"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.9"
# 不锁 av：vsum 自己用 ffmpeg 抽 16k wav、用标准库 wave 读成数组喂给模型，
# 从不走 faster-whisper 的 decode_audio，所以 av 的版本变化影响不到转写。
# 老版本这里钉的是 av>=11,<14，害得用户装 vsum 时被降级 av 甚至弄坏别的项目。
dependencies = ["faster-whisper>=1.0"]

[project.optional-dependencies]
# 抓链接：selenium 驱动 Safari(macOS) / Chrome(其他平台)
browser = ["selenium>=4.10"]
# B站 / YouTube 抓取
yt = ["yt-dlp>=2024.1"]
# 抽帧 OCR：用画面上的拼写核对专名（onnxruntime 已由 faster-whisper 带来）
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = []

[project.scripts]
vsum = "vsum.cli:main"

[tool.setuptools]
packages = ["vsum"]

[tool.setuptools.package-data]
vsum = ["data/*.json"]
