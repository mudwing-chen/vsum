name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest 已到 26.04，setup-python 没有 3.9；3.9 钉在 22.04
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package (no ML deps)
        run: pip install -e . --no-deps
      # 跑 tests/ 下所有 test_*.py，不维护清单：以前清单硬编码三份（两个 job + README），
      # 新加测试时漏过好几次（lookup / ocr / llm 都漏过）。
      - name: Unit tests (no model download)
        run: |
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t"
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (no ML deps)
        run: pip install -e . --no-deps
      # 必须显式用 bash：pwsh 的多行脚本只在**最后一条命令**后检查 $LASTEXITCODE，
      # 中间某个测试挂了 job 照样是绿的（test_browser 那条错断言就是这么一直没被发现）。
      # GitHub 的 bash shell 模板带 -e -o pipefail，第一条失败就退出。
      - name: Unit tests (no model download, no browser)
        shell: bash
        run: |
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t"
          done
